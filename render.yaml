services:
  - type: web
    name: careercompass
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASS
        value: admin123
    # Optional: Use SQLite (works on Render free tier)
    # For production, add PostgreSQL and update app.py